
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <base href="https://www.moi.gov.kw/">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>General Department of Traffic - Ministry of Interior - Kuwait</title>
    <link rel="icon" type="image/x-icon" href="/main/favicon.ico" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/main/css/site.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f2f2f2; }
        .moi-summary-strip { background-color: #e9ecef; color: #495057; padding: 12px 20px; border-radius: 4px; display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; margin-bottom: 20px; border: 1px solid #dee2e6; width: 100%; }
        .violations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; width: 100%; }
        @media (max-width: 600px) { .violations-grid { grid-template-columns: 1fr; } }
        .violation-card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 6px solid #28a745; overflow: hidden; position: relative; border: 1px solid #eee; text-align: right; }
        .violation-card.not-payable { border-top-color: #dc3545; }
        .card-body-moi { padding: 15px; }
        .card-header-moi { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .ticket-no-moi { color: #003366; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .moi-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #003366; }
        .info-row-moi { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: #444; }
        .info-label-moi { font-weight: 700; color: #666; }
        .details-box-moi { background: #fff; border-top: 1px solid #f0f0f0; padding: 15px; font-size: 13px; color: #555; display: none; }
        .chevron-btn-moi { width: 100%; display: flex; justify-content: center; padding: 5px; cursor: pointer; color: #003366; transition: 0.3s; }
        .chevron-btn-moi svg { width: 20px; transition: 0.3s; }
        .chevron-btn-moi.open svg { transform: rotate(180deg); }
        .payment-footer-moi { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 15px; padding-bottom: 50px; }
        .total-selected-row-moi { width: 100%; max-width: 450px; text-align: right; font-weight: 800; color: #003366; font-size: 18px; padding-right: 10px; display: none; }
        .btn-pay-official-moi { background: #003366; color: white; border: none; padding: 14px 0; border-radius: 8px; font-size: 18px; font-weight: 800; cursor: pointer; width: 100%; max-width: 450px; transition: 0.3s; box-shadow: 0 4px 12px rgba(0,51,102,0.2); }
        .btn-pay-official-moi:disabled { background: #ced4da; color: #6c757d; cursor: not-allowed; box-shadow: none; }
        .moi-warning-text { color: #dc3545; font-size: 12px; font-weight: bold; text-align: center; max-width: 500px; margin-top: 10px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <header class="bg-white border-bottom py-3 px-4 flex justify-between items-center d-flex">
            <img src="/main/images/assets/common/logo-moi.svg" style="height: 80px;" />
            <div class="ml-auto d-flex align-items-center">
                <span style="color: #003366; font-weight: bold; cursor: pointer; margin-left: 20px;">English</span>
                <img src="/main/images/assets/general-traffic/logo-general-traffic.svg" style="height: 50px;" />
            </div>
        </header>

        <div class="container mt-5">
            <div class="card shadow-sm border-0 mb-4" style="border-top: 4px solid #003366 !important;">
                <div class="card-body p-5">
                    <h4 class="text-center font-weight-bold mb-4" style="color: #003366; border-bottom: 1px solid #eee; padding-bottom: 15px;">الإدارة العامة للمرور</h4>
                    <form id="manusEnquireForm" class="text-center mx-auto" style="max-width: 400px;">
                        <div class="form-group d-flex justify-content-center mb-3">
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="type1" name="enquiryType" class="custom-control-input" value="1" checked>
                                <label class="custom-control-label" for="type1">الأفراد</label>
                            </div>
                            <div class="custom-control custom-radio custom-control-inline">
                                <input type="radio" id="type2" name="enquiryType" class="custom-control-input" value="2">
                                <label class="custom-control-label" for="type2">الشركات</label>
                            </div>
                        </div>
                        <input type="text" id="civilId" class="form-control text-center mb-3" placeholder="الرقم المدني أو الرقم الموحد" style="height: 50px; font-size: 18px;">
                        <button type="submit" id="btnEnquire" class="btn btn-block font-weight-bold" style="background: #003366; color: white; height: 50px;">إستعلم</button>
                    </form>
                </div>
            </div>

            <div id="responseInfo" class="mt-4"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#manusEnquireForm').submit(async function(e) {
                e.preventDefault();
                const civilId = $('#civilId').val();
                const enquiryType = $('input[name="enquiryType"]:checked').val();

                if (!civilId || civilId.length < 8) {
                    alert('يرجى إدخال الرقم المدني بشكل صحيح');
                    return;
                }

                $('#btnEnquire').html('<span class="spinner-border spinner-border-sm"></span> جاري الاستعلام...').prop('disabled', true);
                $('#responseInfo').empty();

                try {
                    const response = await fetch('/api/fines/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ civilId, enquiryType, lang: 'ar' })
                    });
                    const data = await response.json();
                    
                    if (data.success && data.fines && data.fines.length > 0) {
                        let html = `
                            <div class="moi-summary-strip">
                                <span>عدد المخالفات: ${data.fines.length}</span>
                                <span>المبلغ الإجمالي: ${data.totalAmount} د.ك</span>
                            </div>
                            <div class="violations-grid">
                        `;

                        data.fines.forEach((fine, i) => {
                            const isPayable = fine.payableOnline === 'Y' || fine.isPayable;
                            html += `
                                <div class="violation-card ${isPayable ? '' : 'not-payable'}">
                                    <div class="card-body-moi">
                                        <div class="card-header-moi">
                                            <div class="ticket-no-moi">
                                                <input type="checkbox" class="moi-checkbox select-ticket" data-amount="${fine.amount}" data-id="${fine.ticketNo}" ${isPayable ? '' : 'disabled'}>
                                                <span>رقم: ${fine.ticketNo}</span>
                                            </div>
                                        </div>
                                        <div class="info-row-moi"><span class="info-label-moi">قيمة المخالفة:</span><span>${fine.amount} دك</span></div>
                                        <div class="info-row-moi"><span class="info-label-moi">رقم اللوحة:</span><span>${fine.plateNumber || ''}</span></div>
                                        <div class="info-row-moi"><span class="info-label-moi">تاريخ المخالفة:</span><span>${fine.dateTime || ''}</span></div>
                                        
                                        <div class="details-box-moi" id="details-${i}">
                                            <div class="info-row-moi"><span class="info-label-moi">موقع المخالفة:</span><span>${fine.location || ''}</span></div>
                                            <div class="mt-2 text-muted small italic">- ${fine.description || ''}</div>
                                        </div>
                                        
                                        <div class="chevron-btn-moi" onclick="$(this).toggleClass('open'); $('#details-${i}').slideToggle();">
                                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        html += `
                            </div>
                            <div class="payment-footer-moi">
                                <div id="totalSelectedRow" class="total-selected-row-moi">إجمالي القيمة المختارة : <span id="totalVal">0.000</span></div>
                                <button id="btnPayMoi" class="btn-pay-official-moi" disabled>إدفع</button>
                                <div class="moi-warning-text">بعد إجراء عملية الدفع.. يرجى عدم محاولة الدفع مرة أخرى حيث يجرى تحديث البيانات خلال 15 دقيقة</div>
                            </div>
                        `;
                        $('#responseInfo').html(html);
                    } else {
                        $('#responseInfo').html('<div class="alert alert-info text-center">لا توجد مخالفات مسجلة.</div>');
                    }
                } catch (err) {
                    $('#responseInfo').html('<div class="alert alert-danger text-center">حدث خطأ في الاستعلام.</div>');
                } finally {
                    $('#btnEnquire').html('إستعلم').prop('disabled', false);
                }
            });

            $(document).on('change', '.select-ticket', function() {
                let total = 0;
                $('.select-ticket:checked').each(function() {
                    total += parseFloat($(this).data('amount'));
                });
                
                if (total > 0) {
                    $('#totalVal').text(total.toFixed(3));
                    $('#totalSelectedRow').show();
                    $('#btnPayMoi').prop('disabled', false);
                } else {
                    $('#totalSelectedRow').hide();
                    $('#btnPayMoi').prop('disabled', true);
                }
            });
        });
    </script>
</body>
</html>
